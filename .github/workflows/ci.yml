name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-jwt-secret-minimum-32-characters-long!
      PORT: 5000
      DOTENV_CONFIG_QUIET: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies (deterministic)
        run: npm ci

      - name: Run backend test suite
        run: npm test

